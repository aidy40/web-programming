
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Basics</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #151525;
      color: #f1f1f1;
      max-width: 700px;
      margin: auto;
      padding: 30px;
    }

    section {
      background-color: #23233a;
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid #393957;
      border-radius: 12px;
      transition: 0.3s;
    }

    section:hover {
      border-color: #a78bfa;
    }

    h1 {
      color: #a78bfa;
      text-align: center;
      margin-bottom: 30px;
    }

    h2 {
      color: #c4b5fd;
    }

    p {
      color: #e2e2ee;
    }

    input {
      padding: 9px;
      border: 1px solid #555577;
      border-radius: 6px;
      background-color: #151525;
      color: white;
      margin: 5px 0;
    }

    button {
      padding: 9px 15px;
      background-color: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px 0;
    }

    button:hover {
      background-color: #a78bfa;
      color: #151525;
    }

    #message, #output, #grade, #loop, #fruits, #saved {
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <h1>JavaScript Basics</h1>

  <section>
    <h2>1. Changing Content</h2>
    <p id="message">Welcome to my JavaScript page!</p>
    <button onclick="changeText()">Click Me</button>
  </section>

  <section>
    <h2>2. Reading User Input</h2>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button onclick="greet()">Submit</button>
    <p id="output"></p>
  </section>

  <section>
    <h2>3. Condition (if / else)</h2>
    <p>Enter your exam score:</p>
    <input type="number" id="scoreInput" placeholder="Enter score">
    <button onclick="checkScore()">Check Grade</button>
    <p id="grade"></p>
  </section>

  <section>
    <h2>4. Loop (for)</h2>
    <p>Enter how many times to repeat:</p>
    <input type="number" id="loopInput" placeholder="Enter a number">
    <button onclick="runLoop()">Start Loop</button>
    <p id="loop"></p>
  </section>

  <section>
    <h2>5. Loop Through an Array</h2>
    <p id="fruits"></p>
  </section>

  <section>
    <h2>6. Local Storage</h2>
    <p id="saved"></p>
  </section>

  <script>
    let studentName = 'CHINGUN';
    const MAX_SCORE = 100;

    console.log(studentName);

    function changeText() {
      let message = document.getElementById('message');
      message.textContent = 'Hello! Welcome to my website!';
      message.style.color = '#a78bfa';
    }

    function greet() {
      let userName = document.getElementById('nameInput').value;
      document.getElementById('output').textContent = 'Hello, ' + userName + '! Welcome!';
      localStorage.setItem('name', userName);
    }

    function checkScore() {
      let score = document.getElementById('scoreInput').value;

      localStorage.setItem('score', score);

      if (score >= 90) {
        document.getElementById('grade').textContent = 'Grade: A - Excellent!';
      } else if (score >= 80) {
        document.getElementById('grade').textContent = 'Grade: B - Very Good!';
      } else if (score >= 70) {
        document.getElementById('grade').textContent = 'Grade: C - Good!';
      } else {
        document.getElementById('grade').textContent = 'Grade: F - Try Again!';
      }
    }

    function runLoop() {
      let count = document.getElementById('loopInput').value;

      localStorage.setItem('loopNumber', count);

      let result = '';

      for (let i = 1; i <= count; i++) {
        result += 'Number ' + i + '<br>';
      }

      document.getElementById('loop').innerHTML = result;
    }

    let fruits = ['orange', 'grape', 'watermelon'];
    let fruitResult = '';

    for (let fruit of fruits) {
      fruitResult += fruit + '<br>';
    }

    document.getElementById('fruits').innerHTML = fruitResult;

    let savedName = localStorage.getItem('name');
    let savedScore = localStorage.getItem('score');
    let savedLoopNumber = localStorage.getItem('loopNumber');

    if (savedName !== null) {
      document.getElementById('nameInput').value = savedName;
      document.getElementById('output').textContent = 'Hello, ' + savedName + '! Welcome!';
    }

    if (savedScore !== null) {
      document.getElementById('scoreInput').value = savedScore;

      if (savedScore >= 90) {
        document.getElementById('grade').textContent = 'Grade: A - Excellent!';
      } else if (savedScore >= 80) {
        document.getElementById('grade').textContent = 'Grade: B - Very Good!';
      } else if (savedScore >= 70) {
        document.getElementById('grade').textContent = 'Grade: C - Good!';
      } else {
        document.getElementById('grade').textContent = 'Grade: F - Try Again!';
      }
    }

    if (savedLoopNumber !== null) {
      document.getElementById('loopInput').value = savedLoopNumber;

      let savedResult = '';

      for (let i = 1; i <= savedLoopNumber; i++) {
        savedResult += 'Number ' + i + '<br>';
      }

      document.getElementById('loop').innerHTML = savedResult;
    }

    localStorage.setItem('username', 'CHINGUN');

    document.getElementById('saved').textContent =
      'Student name: ' + localStorage.getItem('username');

  </script>

</body>
</html>
