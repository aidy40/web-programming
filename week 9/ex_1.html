
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Library - Keyboard Navigation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #151525;
      color: #f1f1f1;
      margin: 0;
      padding: 30px;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
    }

    section {
      background: #23233a;
      padding: 28px;
      border: 1px solid #393957;
      border-radius: 14px;
    }

    h1 {
      color: #c4b5fd;
    }

    p {
      line-height: 1.6;
      color: #aaaac2;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .action {
      background: #7c3aed;
      color: white;
    }

    .action:hover {
      background: #6d28d9;
    }

    .close {
      margin-left: 10px;
      background: #3b2636;
      color: #fca5a5;
      font-size: 18px;
    }

    .close:hover {
      background: #542c3c;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #c4b5fd;
      outline-offset: 4px;
    }

    #result {
      margin-top: 24px;
      padding: 14px;
      background: #151525;
      border: 1px solid #393957;
      border-radius: 8px;
      color: #c4b5fd;
    }

    a {
      color: #a78bfa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main>
    <section>

      <h1>Manga Library Keyboard Test</h1>

      <p>
        Test keyboard navigation using the buttons below.
        Press Tab to move between elements and Enter or Space
        to activate a selected button.
      </p>

      <button class="action" type="button" id="action-button">
        Explore Library
      </button>

      <button
        class="close"
        type="button"
        id="close-button"
        aria-label="Reset the test message"
      >×</button>

      <p id="result" role="status" aria-live="polite">
        Choose a button to begin the accessibility test.
      </p>

      <a href="index.html">Return to Week 9</a>

    </section>
  </main>

  <script>
    document.getElementById('action-button').addEventListener('click', function() {
      document.getElementById('result').textContent =
        'Success! You activated the library button using a mouse or keyboard.';
    });

    document.getElementById('close-button').addEventListener('click', function() {
      document.getElementById('result').textContent =
        'The test message has been reset. You can try again.';
    });
  </script>

</body>
</html>
