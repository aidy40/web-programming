
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chingun's Manga Library</title>

  <style>
    :root {
      --purple: #7c3aed;
      --light-purple: #a78bfa;
      --background: #151525;
      --card: #23233a;
      --border: #393957;
      --text: #f1f1f1;
      --muted: #aaaac2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      background: #23233a;
      padding: 30px 20px 32px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      max-width: 1000px;
      margin: 0 auto 24px;
      color: var(--light-purple);
      font-size: 30px;
    }

    #search-section {
      max-width: 1000px;
      margin: 0 auto;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #151525;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid var(--purple);
    }

    button {
      padding: 13px 25px;
      border: none;
      border-radius: 7px;
      background: var(--purple);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      background: #6d28d9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #results-section {
      max-width: 1040px;
      margin: 0 auto;
      padding: 24px 20px 50px;
    }

    #results-section h2 {
      margin: 0 0 12px;
      font-size: 22px;
      color: var(--light-purple);
    }

    #status {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    #status.error {
      color: #f87171;
    }

    #status.empty {
      color: #fbbf24;
    }

    #manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 18px;
    }

    .manga-card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 9px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .manga-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 5px 14px #00000040;
    }

    .manga-cover,
    .no-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      display: block;
      object-fit: cover;
      background: #393957;
    }

    .no-cover {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--light-purple);
      font-size: 14px;
    }

    .card-info {
      padding: 12px;
    }

    .card-info h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      color: var(--light-purple);
    }

    .card-info p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .skeleton {
      aspect-ratio: 2 / 3;
      background: #393957;
      border-radius: 8px;
      animation: loading 1s infinite alternate;
    }

    @keyframes loading {
      from {
        opacity: 0.4;
      }

      to {
        opacity: 1;
      }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      border: 2px solid #a78bfa60;
      border-top-color: var(--light-purple);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    a {
      color: var(--light-purple);
      text-decoration: none;
    }

    a:hover {
      color: white;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      header {
        padding: 25px 16px;
      }

      form {
        gap: 6px;
      }

      button {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Chingun's Manga Library</h1>

    <section id="search-section">
      <form id="search-form">
        <input
          type="text"
          id="search-input"
          placeholder="Search manga title..."
          required
        >

        <button type="submit" id="search-btn">
          Search
        </button>
      </form>
    </section>
  </header>

  <main>
    <section id="results-section">
      <h2>Manga Collection</h2>

      <p id="status">
        Search for your favorite manga to explore the collection.
      </p>

      <div id="manga-grid"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    const status = document.getElementById('status');
    const grid = document.getElementById('manga-grid');
    const button = document.getElementById('search-btn');

    function setStatus(message, type) {
      status.textContent = message;
      status.className = type;
    }

    function showLoading() {
      grid.textContent = '';

      for (let i = 0; i < 8; i++) {
        let card = document.createElement('div');
        card.className = 'skeleton';
        grid.appendChild(card);
      }
    }

    function showManga(mangaList) {
      grid.textContent = '';

      for (let manga of mangaList) {
        let card = document.createElement('article');
        card.className = 'manga-card';

        if (manga.images && manga.images.jpg && manga.images.jpg.image_url) {
          let cover = document.createElement('img');

          cover.className = 'manga-cover';
          cover.src = manga.images.jpg.image_url;
          cover.alt = 'Cover of ' + manga.title;
          cover.loading = 'lazy';

          card.appendChild(cover);
        } else {
          let cover = document.createElement('div');

          cover.className = 'no-cover';
          cover.textContent = 'No cover available';

          card.appendChild(cover);
        }

        let info = document.createElement('div');
        info.className = 'card-info';

        let title = document.createElement('h3');
        title.textContent = manga.title || 'Unknown title';

        let author = document.createElement('p');
        author.textContent =
          manga.authors && manga.authors.length > 0
            ? manga.authors.map(item => item.name).join(', ')
            : 'Unknown author';

        let year = document.createElement('p');
        year.textContent = manga.published
          ? 'Published: ' + new Date(manga.published.from).getFullYear()
          : 'Year unavailable';

        let score = document.createElement('p');
        score.textContent = manga.score
          ? 'Score: ' + manga.score + ' / 10'
          : 'Score unavailable';

        let type = document.createElement('p');
        type.textContent = 'Type: ' + (manga.type || 'Manga');

        info.appendChild(title);
        info.appendChild(author);
        info.appendChild(year);
        info.appendChild(score);
        info.appendChild(type);

        card.appendChild(info);
        grid.appendChild(card);
      }
    }

    async function searchManga(query) {
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span>Searching';

      setStatus('Searching manga collection...', 'info');
      showLoading();

      try {
        const url =
          'https://api.jikan.moe/v4/manga?q=' +
          encodeURIComponent(query) + '&limit=16';

        const res = await fetch(url);

        if (!res.ok) {
          throw new Error('Request failed');
        }

        const data = await res.json();

        if (!data.data || data.data.length === 0) {
          grid.textContent = '';
          setStatus('No manga found. Try another title.', 'empty');
          return;
        }

        showManga(data.data);

        setStatus(
          'Showing ' + data.data.length +
          ' manga results for "' + query + '".',
          'info'
        );

      } catch (error) {
        grid.textContent = '';

        setStatus(
          'Could not load manga. Check your connection and try again.',
          'error'
        );

      } finally {
        button.disabled = false;
        button.textContent = 'Search';
      }
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const query = input.value.trim();

      if (query !== '') {
        searchManga(query);
      }
    });

    input.value = 'One Piece';
    searchManga('One Piece');
  </script>

</body>
</html>
