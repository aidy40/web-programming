
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 7 - Manga Library</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #151525;
      color: #f1f1f1;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
    }

    .card {
      background-color: #23233a;
      padding: 25px;
      margin-bottom: 18px;
      border: 1px solid #393957;
      border-radius: 12px;
      transition: 0.3s;
    }

    .card:hover {
      border-color: #7c3aed;
      transform: translateY(-4px);
    }

    h1, h2 {
      color: #c4b5fd;
    }

    p {
      color: #aaaac2;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      color: #ffffff;
      background-color: #7c3aed;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    a:hover {
      background-color: #6d28d9;
      transform: scale(1.03);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Week 7</h1>
    <h2>Manga Search and Discovery</h2>

    <div class="card">
      <h2>Manga Library</h2>
      <p>Explore manga titles, discover authors, and check ratings and publication details.</p>
      <a href="book-search.html">Explore Manga</a>
    </div>

  </div>

</body>
</html>
