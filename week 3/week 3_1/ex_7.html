
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #eeeae0;
      padding: 40px 16px;
    }

    .card {
      background-color: #faf8f2;
      border: 1px solid #d5d0c5;
      border-top: 5px solid #f04435;
      padding: 36px;
      max-width: 360px;
      margin: 0 auto;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      background-color: #171717;
      color: #f04435;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: bold;
      color: #171717;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .role {
      color: #77746d;
      margin-bottom: 20px;
      font-size: 14px;
    }

    hr {
      border: none;
      border-top: 1px solid #d5d0c5;
      margin-bottom: 20px;
    }

    .skills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      background-color: #293fda;
      color: white;
      padding: 6px 12px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">C</div>
    <h2 class="name">CHINGUN</h2>
    <p class="role">Computer Science Student</p>
    <hr>
    <div class="skills">
      <span class="badge">Researching</span>
      <span class="badge">Communication</span>
      <span class="badge">Emotional Intelligence</span>
    </div>
  </div>
</body>
</html>
