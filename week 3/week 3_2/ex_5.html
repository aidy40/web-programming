
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #eeeae0;
      color: #22211e;
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #171717;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 4px solid #f04435;
      z-index: 1000;
    }

    .nav-logo {
      color: #f04435;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: #aaa69d;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #f04435;
    }

    .content {
      padding-top: 70px;
    }

    .section {
      min-height: 300px;
      padding: 40px;
      font-size: 18px;
      font-family: 'Space Grotesk', sans-serif;
    }

    #s1 {
      background: #eeeae0;
    }

    #s2 {
      background: #293fda;
      color: white;
    }

    #s3 {
      background: #f04435;
      color: #171717;
    }

    @media (max-width: 500px) {
      .nav {
        padding: 15px 18px;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a {
        font-size: 10px;
      }

      .section {
        padding: 30px 22px;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="#">CHINGUN</a>

    <div class="nav-links">
      <a href="#s1">Home</a>
      <a href="#s2">Topics</a>
      <a href="#s3">Quiz</a>
    </div>
  </nav>

  <div class="content">
    <div class="section" id="s1">
      Section 1 — scroll down...
    </div>

    <div class="section" id="s2">
      Section 2 — nav stays fixed!
    </div>

    <div class="section" id="s3">
      Section 3
    </div>
  </div>
</body>
</html>
