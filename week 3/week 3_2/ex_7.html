
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>CHINGUN CSS Advanced Page</title>

  <style>
    :root {
      --primary: #172e55;
      --accent: #2563eb;
      --highlight: #f59e0b;
      --bg: #f4f6fb;
      --text: #17233c;
      --radius: 12px;
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #111827;
        --text: #e2e8f0;
        --primary: #93b4f5;
        --accent: #60a5fa;
      }
    }

    *,*::before,*::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #172e55;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
    }

    nav span {
      color: #f59e0b;
      font-weight: bold;
      font-size: 1.2rem;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #f59e0b;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      padding: 140px 40px 80px;
      text-align: center;
      background: linear-gradient(135deg, var(--bg) 0%, #dbeafe 100%);
    }

    .hero h1 {
      font-size: 2.5rem;
      color: var(--primary);
      animation: fadeSlideIn .8s ease-out forwards;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 1.1rem;
      color: #64748b;
    }

    .skills-section {
      padding: 0 24px 60px;
    }

    .sticky-h2 {
      position: sticky;
      top: 56px;
      background: var(--bg);
      color: var(--primary);
      font-size: 1.4rem;
      padding: 14px 0 10px;
      border-bottom: 3px solid var(--accent);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media(min-width:640px) {
      .grid {
        grid-template-columns: repeat(3,1fr);
      }
    }

    .card {
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      transition: transform .25s ease,box-shadow .25s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 28px rgba(37,99,235,.18);
    }

    .card[data-icon]::before {
      content: attr(data-icon);
      display: block;
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <nav>
    <span>CHINGUN</span>
    <div>
      <a href="#">Home</a>
      <a href="#skills">Skills</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am CHINGUN</h1>
    <p>Computer Science · Gachon University · Week 3 CSS Advanced</p>
  </section>

  <section class="skills-section" id="skills">
    <h2 class="sticky-h2">My Skills</h2>

    <div class="grid">
      <div class="card" data-icon="🔎">
        Researching
      </div>

      <div class="card" data-icon="💬">
        Communication
      </div>

      <div class="card" data-icon="🧠">
        Emotional Intelligence
      </div>

      <div class="card" data-icon="🌐">
        HTML5
      </div>

      <div class="card" data-icon="🎨">
        CSS3
      </div>

      <div class="card" data-icon="🎮">
        Gaming
      </div>
    </div>
  </section>
</body>
</html>
