
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chingun's API Workspace</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #151525;
      color: #f1f1f1;
      max-width: 800px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      color: #a78bfa;
      text-align: center;
      margin-bottom: 30px;
    }

    h2 {
      color: #c4b5fd;
    }

    h3 {
      color: #ddd6fe;
    }

    section {
      background: #23233a;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #393957;
      border-radius: 12px;
      transition: 0.3s;
    }

    section:hover {
      border-color: #a78bfa;
    }

    input, textarea, button {
      padding: 10px;
      margin: 5px 0;
      font: inherit;
      border-radius: 6px;
    }

    input, textarea {
      box-sizing: border-box;
      width: 100%;
      background: #151525;
      color: white;
      border: 1px solid #555577;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: 2px solid #a78bfa;
      border-color: #a78bfa;
    }

    button {
      cursor: pointer;
      background: #7c3aed;
      color: white;
      border: none;
      transition: 0.3s;
    }

    button:hover {
      background: #a78bfa;
      color: #151525;
    }

    .todo {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #393957;
      padding: 8px 0;
    }

    .todo input[type="checkbox"] {
      width: auto;
      accent-color: #a78bfa;
    }

    .todo input[type="text"] {
      flex: 1;
      min-width: 0;
    }

    .completed {
      text-decoration: line-through;
      color: #8888a5;
    }

    .status {
      color: #a78bfa;
    }

    a {
      color: #c4b5fd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .subtitle {
      text-align: center;
      color: #aaaac2;
      margin-bottom: 30px;
    }

    @media (max-width: 500px) {
      body {
        padding: 15px;
      }

      .todo {
        gap: 5px;
      }

      .todo button {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <h1>Chingun's API Workspace</h1>
  <p class="subtitle">JavaScript Fetch API & Async Programming</p>

  <section>
    <h2>1. User Profile</h2>
    <p id="userStatus">Loading user...</p>
    <div id="user"></div>
    <button onclick="loadUser(true)">Generate Another User</button>
  </section>

  <section>
    <h2>2. Edit My Blog Post</h2>

    <label for="postTitle">Post Title</label>
    <input type="text" id="postTitle">

    <label for="postBody">Post Content</label>
    <textarea id="postBody"></textarea>

    <button onclick="savePost()">Save Changes</button>
    <p id="postStatus" class="status"></p>

    <h2>Blog Preview</h2>
    <h3 id="previewTitle"></h3>
    <p id="previewAuthor"></p>
    <p id="previewBody"></p>
  </section>

  <section>
    <h2>3. My Daily Tasks</h2>
    <p>Manage your tasks by checking, editing, or deleting them.</p>

    <input type="text" id="newTodo" placeholder="Write a new task">
    <button onclick="addTodo()">Add Task</button>

    <div id="todos"></div>
    <p id="todoStatus" class="status"></p>
  </section>

  <p><a href="index.html">← Back to Week 6</a></p>

  <script>
    let currentUser = null;

    let todos = JSON.parse(localStorage.getItem('chingunTodos') || 'null') || [
      { text: 'Study JavaScript functions', completed: false },
      { text: 'Practice working with APIs', completed: false },
      { text: 'Complete Week 6 assignment', completed: false }
    ];

    document.getElementById('postTitle').value =
      localStorage.getItem('chingunPostTitle') || 'My Programming Journey';

    document.getElementById('postBody').value =
      localStorage.getItem('chingunPostBody') ||
      'Hello! My name is Chingun. I am learning JavaScript, Fetch API, async and await. This project helps me understand how websites communicate with external APIs.';

    function updatePreview() {
      document.getElementById('previewTitle').textContent =
        document.getElementById('postTitle').value;

      document.getElementById('previewBody').textContent =
        document.getElementById('postBody').value;

      document.getElementById('previewAuthor').textContent =
        currentUser ? 'Created by ' + currentUser.name : 'Loading author...';
    }

    async function loadUser(randomize) {
      let id = randomize
        ? Math.floor(Math.random() * 5) + 1
        : Number(localStorage.getItem('chingunUserId')) || 2;

      document.getElementById('userStatus').textContent = 'Loading profile...';

      try {
        const res = await fetch(
          'https://jsonplaceholder.typicode.com/users/' + id
        );

        if (!res.ok) {
          throw new Error('User request failed');
        }

        currentUser = await res.json();

        localStorage.setItem('chingunUserId', currentUser.id);

        document.getElementById('user').textContent = '';

        let name = document.createElement('p');
        name.textContent = 'Name: ' + currentUser.name;

        let username = document.createElement('p');
        username.textContent = 'Username: ' + currentUser.username;

        let email = document.createElement('p');
        email.textContent = 'Email: ' + currentUser.email;

        document.getElementById('user').appendChild(name);
        document.getElementById('user').appendChild(username);
        document.getElementById('user').appendChild(email);

        document.getElementById('userStatus').textContent =
          'Profile successfully loaded!';

        updatePreview();

      } catch (error) {
        document.getElementById('userStatus').textContent =
          'Unable to load profile. Please try again.';
      }
    }

    function savePost() {
      localStorage.setItem(
        'chingunPostTitle',
        document.getElementById('postTitle').value
      );

      localStorage.setItem(
        'chingunPostBody',
        document.getElementById('postBody').value
      );

      updatePreview();

      document.getElementById('postStatus').textContent =
        'Your blog post has been saved!';
    }

    function saveTodos() {
      localStorage.setItem('chingunTodos', JSON.stringify(todos));
    }

    function showTodos() {
      let output = document.getElementById('todos');
      output.textContent = '';

      for (let todo of todos) {
        let row = document.createElement('div');
        row.className = 'todo';

        let checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;

        let text = document.createElement('input');
        text.type = 'text';
        text.value = todo.text;

        if (todo.completed) {
          text.className = 'completed';
        }

        let remove = document.createElement('button');
        remove.textContent = 'Delete';

        checkbox.addEventListener('change', function () {
          todo.completed = checkbox.checked;
          saveTodos();
          showTodos();
        });

        text.addEventListener('change', function () {
          todo.text = text.value;
          saveTodos();
        });

        remove.addEventListener('click', function () {
          todos = todos.filter(item => item !== todo);
          saveTodos();
          showTodos();
        });

        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(remove);

        output.appendChild(row);
      }

      let completed = todos.filter(todo => todo.completed).length;

      document.getElementById('todoStatus').textContent =
        completed + ' / ' + todos.length + ' tasks completed.';
    }

    function addTodo() {
      let input = document.getElementById('newTodo');
      let text = input.value.trim();

      if (text === '') {
        return;
      }

      todos.push({
        text: text,
        completed: false
      });

      input.value = '';

      saveTodos();
      showTodos();
    }

    document.getElementById('postTitle').addEventListener('input', updatePreview);
    document.getElementById('postBody').addEventListener('input', updatePreview);

    document.getElementById('newTodo').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTodo();
      }
    });

    showTodos();
    updatePreview();
    loadUser(false);

  </script>

</body>
</html>
